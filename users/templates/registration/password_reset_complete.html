<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<style>
    body {
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        font-family: Arial, sans-serif;
    }

    .reset-container {
        max-width: 500px;
        margin: 60px auto;
        padding: 30px;
        background-color: #ffffff;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
    }

    .reset-header {
        text-align: center;
        margin-bottom: 20px;
    }

    .reset-header h1 {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 10px;
        color: #007bff;
    }

    .form-label {
        font-weight: 500;
        color: #333;
    }

    .form-control {
        border: 2px solid #ced4da;
        border-radius: 10px;
        padding: 10px 15px;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .form-control:focus {
        border-color: #007bff;
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        transform: scale(1.02);
    }

    .btn-reset {
        background: linear-gradient(90deg, #007bff, #0056b3);
        border: none;
        border-radius: 10px;
        padding: 10px 15px;
        font-weight: bold;
        font-size: 1rem;
        transition: background 0.3s, transform 0.2s;
    }

    .btn-reset:hover {
        background: linear-gradient(90deg, #0056b3, #007bff);
        transform: translateY(-2px);
    }

    .icon-box {
        position: absolute;
        top: -50px;
        right: -50px;
        width: 100px;
        height: 100px;
        background: #007bff;
        border-radius: 50%;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 2.5rem;
    }

    .icon-box i {
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-10px);
        }
    }
</style>
<body>
    <div class="container">
        <div class="reset-container">
            <!-- Decorative Icon -->
            <div class="icon-box">
                <i class="fas fa-lock"></i>
            </div>

            <div class="reset-header">
                <h1>Reset Your Password</h1>
                <p class="text-muted">Enter a new password to secure your account</p>
            </div>
            <form method="POST" class="needs-validation" novalidate>
                {% csrf_token %}

                <!-- New Password Field -->
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Enter your new password" required>
                    <div class="invalid-feedback">
                        Please enter your new password.
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm your new password" required>
                    <div class="invalid-feedback">
                        Please confirm your new password.
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-reset text-white">Change My Password</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Client-side form validation
        (function () {
            'use strict';
            const forms = document.querySelectorAll('.needs-validation');
            Array.from(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
